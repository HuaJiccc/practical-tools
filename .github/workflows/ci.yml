name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-check:
    name: 静态检查（Windows / Python 3.13）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 语法编译检查
        run: python -m compileall -q app dev

      # ptools 全部是纯标准库源码，没有编译产物，也不需要特定解释器版本。
      # 这一步失败通常意味着某个模块引入了第三方依赖，或语法不兼容。
      - name: 后端模块可导入
        run: python -c "import sys; sys.path.insert(0, 'app'); import ptools, ptools.api, ptools.server, ptools.translate, ptools.todo, ptools.nlptime, ptools.currency; print('ptools import ok')"

      - name: 前端资源与图标引用
        run: python dev/dev_check_assets.py

      - name: 依赖声明可安装
        run: pip install -r requirements.txt
