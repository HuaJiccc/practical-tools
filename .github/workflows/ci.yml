name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static-check:
    name: 静态检查（Windows / Python 3.13）
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 语法编译检查
        run: python -m compileall -q app dev

      # app/ptools 是随仓库分发的字节码，magic number 绑定解释器版本。
      # 这一步失败通常意味着 pyc 被清理了，或 Python 版本不是 3.13。
      - name: 预编译模块可导入
        run: python -c "import sys; sys.path.insert(0, 'app'); import ptools.config, ptools.store, ptools.translate, ptools.todo, ptools.notes, ptools.server; print('ptools import ok')"

      - name: 前端资源与图标引用
        run: python dev/dev_check_assets.py

      - name: 依赖声明可安装
        run: pip install -r requirements.txt
